<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>
</head>

<body>

    <h1>Student Event Registration</h1>

    <h2>TechFest 2026</h2>

    <p>
        Join us for an exciting technical event featuring
        workshops, competitions and expert sessions.
    </p>

    <form>

        <label>Student Name:</label><br>
        <input type="text" name="studentName"><br><br>

        <label>Register Number:</label><br>
        <input type="text" name="registerNumber"><br><br>

        <label>Department:</label><br>
        <input type="text" name="department"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Event Date:</label><br>
        <input type="date" name="eventDate"><br><br>

        <button type="submit">Register</button>

    </form>

</body>
</html>
