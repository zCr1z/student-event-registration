<!DOCTYPE html>
<html>

<head>
    <title>Student Event Registration</title>
</head>

<body>

    <h1>TechFest 2026</h1>

    <p>
        Join us for a technical event featuring workshops,
        coding activities and technology sessions.
    </p>

    <form>

        <label>Student Name</label>
        <input type="text">

        <br><br>

        <label>Register Number</label>
        <input type="text">

        <br><br>

        <label>Department</label>
        <input type="text">

        <br><br>

        <label>Email</label>
        <input type="email">

        <br><br>

        <label>Event Date</label>
        <input type="date">

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

</body>
</html>
